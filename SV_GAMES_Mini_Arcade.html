<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10112d">
<title>SV GAMES — Mini Arcade</title>
<style>
:root{--ink:#f8f7ff;--muted:#c8c8e8;--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.18);--pink:#ff4fd8;--blue:#5ee7ff;--gold:#ffd166}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#10112d;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.32;z-index:-2;animation:float 16s ease-in-out infinite alternate}
body:before{background:#7928ca;top:-22vmax;left:-18vmax}body:after{background:#007cf0;right:-20vmax;bottom:-25vmax;animation-delay:-7s}
@keyframes float{to{transform:translate(12vw,10vh) scale(1.15)}} @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}} @keyframes bob{50%{transform:translateY(-7px)}} @keyframes shine{to{background-position:200% center}}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#725bff,var(--blue));box-shadow:0 8px 30px #6a4cff55;font-size:25px;animation:bob 3s ease-in-out infinite}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.25rem);letter-spacing:.04em}.subtitle{color:var(--muted);font-size:.9rem;margin-top:2px}
.pill{border:1px solid var(--line);background:var(--glass);padding:9px 13px;border-radius:999px;color:var(--muted);font-size:.85rem}
.hero{padding:36px 0 22px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.2em;font-weight:800;font-size:.72rem}.hero h2{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:10px 0 12px;max-width:700px}.gradient{background:linear-gradient(90deg,#fff,var(--blue),var(--pink),var(--gold),#fff);background-size:200% auto;color:transparent;background-clip:text;animation:shine 7s linear infinite}.hero p{color:var(--muted);max-width:600px;line-height:1.6;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:22px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));border-radius:23px;padding:20px;text-align:left;color:var(--ink);cursor:pointer;transition:transform .2s,border-color .2s,background .2s;min-height:205px;position:relative;overflow:hidden}.card:hover{transform:translateY(-5px);border-color:#ffffff75;background:rgba(255,255,255,.14)}.card .emoji{font-size:2.5rem;display:block;margin-bottom:13px;filter:drop-shadow(0 5px 10px #0004)}.card h3{margin:0 0 7px;font-size:1.18rem}.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}.tag{display:inline-block;margin-top:15px;font-size:.72rem;font-weight:800;color:#12122e;background:var(--blue);padding:5px 9px;border-radius:999px}
.panel{margin-top:20px;border:1px solid var(--line);border-radius:25px;background:rgba(12,13,38,.72);backdrop-filter:blur(18px);padding:clamp(18px,4vw,30px);animation:pop .25s ease}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.panel h2{margin:0;font-size:1.5rem}.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:800;cursor:pointer;color:#11122d;background:linear-gradient(135deg,var(--blue),#b4f7ff);transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}.game-area{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 0}.big{font-size:clamp(3rem,12vw,5.5rem);line-height:1.2}.message{color:var(--muted);margin:12px 0 0;line-height:1.5}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.choice{font-size:2rem;width:76px;height:76px;border-radius:20px;border:1px solid var(--line);background:var(--glass);cursor:pointer;transition:.2s}.choice:hover{transform:scale(1.08) rotate(-3deg);background:#ffffff22}.board{display:grid;grid-template-columns:repeat(3,minmax(65px,100px));gap:9px;margin:20px auto}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:17px;background:var(--glass);color:var(--ink);font-size:2.5rem;font-weight:900;cursor:pointer}.cell:hover{background:#ffffff20}.input{max-width:230px;width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:#ffffff12;color:white;font-size:1.1rem;text-align:center;outline:none}.score{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}.score span{padding:8px 12px;background:var(--glass);border:1px solid var(--line);border-radius:12px;color:var(--muted)}.score b{color:white}.footer{text-align:center;color:#aaaad0;font-size:.8rem;padding-top:32px}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">🎮</div><div><h1>SV <span class="gradient">GAMES</span></h1><div class="subtitle">Your mini arcade • Play anywhere</div></div></div><div class="pill">✨ 4 mini-games</div></header>
<section class="hero"><div class="eyebrow">WELCOME TO THE ARCADE</div><h2>Small games.<br><span class="gradient">Big fun.</span></h2><p>Pick a game, challenge yourself, and enjoy the animated neon arcade. No sign-in needed — just tap and play!</p></section>
<section class="grid" id="gameGrid">
<button class="card" onclick="openGame('rps')"><span class="emoji">✊</span><h3>Rock Paper Scissors</h3><p>Can you outsmart the computer?</p><span class="tag">QUICK MATCH</span></button>
<button class="card" onclick="openGame('ttt')"><span class="emoji">❎</span><h3>Tic-Tac-Toe</h3><p>Get three in a row to win.</p><span class="tag">2 PLAYER</span></button>
<button class="card" onclick="openGame('guess')"><span class="emoji">🔢</span><h3>Guess the Number</h3><p>Find the secret number from 1 to 100.</p><span class="tag">BRAIN GAME</span></button>
<button class="card" onclick="openGame('click')"><span class="emoji">⚡</span><h3>Speed Click</h3><p>How many times can you click in 10 seconds?</p><span class="tag">REACTION</span></button>
</section>
<section id="panel" class="panel" hidden></section>
<div class="footer">SV GAMES • Made for fun ✦ Works in your mobile browser</div>
</div>
<script>
const panel=document.getElementById('panel');let game='',rpsScore=0,guessSecret=0,guessCount=0,tttBoard=[],tttTurn='X',tttOver=false,clickCount=0,clickTime=10,clickTimer=null,clickRunning=false;
function openGame(which){game=which;panel.hidden=false;panel.scrollIntoView({behavior:'smooth',block:'start'});if(which==='rps')drawRPS();if(which==='ttt')drawTTT();if(which==='guess')drawGuess(true);if(which==='click')drawClick(); }
function shell(title,body){panel.innerHTML=`<div class="panel-head"><h2>${title}</h2><button class="btn secondary" onclick="closeGame()">← All games</button></div>${body}`;}
function closeGame(){if(clickTimer)clearInterval(clickTimer);panel.hidden=true;document.getElementById('gameGrid').scrollIntoView({behavior:'smooth'});}
function drawRPS(){shell('✊ Rock Paper Scissors',`<div class="game-area"><div class="big" id="rpsFace">🤜 🤛</div><p class="message" id="rpsMsg">Choose your move!</p><div class="choices"><button class="choice" aria-label="Rock" onclick="playRPS('Rock')">🪨</button><button class="choice" aria-label="Paper" onclick="playRPS('Paper')">📄</button><button class="choice" aria-label="Scissors" onclick="playRPS('Scissors')">✂️</button></div><div class="score"><span>You: <b id="youScore">${rpsScore}</b></span><span>Computer: <b id="cpuScore">${window.cpuScore||0}</b></span></div></div><div class="actions"><button class="btn secondary" onclick="rpsScore=0;window.cpuScore=0;drawRPS()">Reset score</button></div>`)}
function playRPS(p){const opts=['Rock','Paper','Scissors'],c=opts[Math.floor(Math.random()*3)];let result=p===c?'It’s a tie!':((p==='Rock'&&c==='Scissors')||(p==='Paper'&&c==='Rock')||(p==='Scissors'&&c==='Paper'))?'You win this round!':'Computer wins this round!';if(result.startsWith('You win'))rpsScore++;if(result.startsWith('Computer'))window.cpuScore=(window.cpuScore||0)+1;document.getElementById('rpsFace').textContent=({Rock:'🪨',Paper:'📄',Scissors:'✂️'})[p]+'  vs  '+({Rock:'🪨',Paper:'📄',Scissors:'✂️'})[c];document.getElementById('rpsMsg').textContent=`You chose ${p}. Computer chose ${c}. ${result}`;document.getElementById('youScore').textContent=rpsScore;document.getElementById('cpuScore').textContent=window.cpuScore||0;}
function drawTTT(){tttBoard=Array(9).fill('');tttTurn='X';tttOver=false;renderTTT();}
function renderTTT(){shell('❎ Tic-Tac-Toe',`<div class="game-area"><p class="message" id="tttMsg">${tttOver?'Game over':`Player ${tttTurn}’s turn`}</p><div class="board">${tttBoard.map((v,i)=>`<button class="cell" onclick="moveTTT(${i})" ${v||tttOver?'disabled':''}>${v}</button>`).join('')}</div><p class="message">Take turns on the same device.</p></div><div class="actions"><button class="btn" onclick="drawTTT()">New round</button></div>`)}
function moveTTT(i){if(tttBoard[i]||tttOver)return;tttBoard[i]=tttTurn;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(wins.some(w=>w.every(n=>tttBoard[n]===tttTurn))){tttOver=true;renderTTT();document.getElementById('tttMsg').textContent=`🎉 Player ${tttTurn} wins!`;return;}if(tttBoard.every(Boolean)){tttOver=true;renderTTT();document.getElementById('tttMsg').textContent='🤝 It’s a draw!';return;}tttTurn=tttTurn==='X'?'O':'X';renderTTT();}
function drawGuess(reset){if(reset){guessSecret=Math.floor(Math.random()*100)+1;guessCount=0;}shell('🔢 Guess the Number',`<div class="game-area"><div class="big">🔐</div><p class="message" id="guessMsg">I’m thinking of a number from 1 to 100. Can you guess it?</p><form onsubmit="guessNumber(event)" class="actions"><input class="input" id="guessInput" type="number" min="1" max="100" placeholder="Enter 1–100" required><button class="btn">Guess</button></form><p class="message" id="guessCount">Guesses: ${guessCount}</p></div><div class="actions"><button class="btn secondary" onclick="drawGuess(true)">New number</button></div>`)}
function guessNumber(e){e.preventDefault();const input=document.getElementById('guessInput'),n=Number(input.value),msg=document.getElementById('guessMsg');if(n<1||n>100){msg.textContent='Please enter a number from 1 to 100.';return;}guessCount++;msg.textContent=n===guessSecret?`🎉 Correct! You found ${guessSecret} in ${guessCount} guess${guessCount===1?'':'es'}!`:n<guessSecret?'📈 Too low — try a bigger number!':'📉 Too high — try a smaller number!';document.getElementById('guessCount').textContent='Guesses: '+guessCount;if(n===guessSecret)input.disabled=true;else{input.value='';input.focus();}}
function drawClick(){if(clickTimer)clearInterval(clickTimer);clickCount=0;clickTime=10;clickRunning=false;shell('⚡ Speed Click',`<div class="game-area"><div class="big" id="clickCount">${clickCount}</div><p class="message" id="clickMsg">Press start, then click as fast as you can for 10 seconds!</p><p class="message">Time left: <b id="clickTime">10</b>s</p><button class="btn" id="clickBtn" onclick="clickGameTap()">Start game</button></div>`)}
function clickGameTap(){const btn=document.getElementById('clickBtn');if(!clickRunning&&clickTime===10&&clickCount===0){clickRunning=true;btn.textContent='CLICK!';document.getElementById('clickMsg').textContent='Go go go!';clickTimer=setInterval(()=>{clickTime--;document.getElementById('clickTime').textContent=clickTime;if(clickTime<=0){clearInterval(clickTimer);clickRunning=false;btn.textContent='Play again';document.getElementById('clickMsg').textContent=`⏱️ Time! You scored ${clickCount} clicks.`;clickTime=0;}},1000);return;}if(clickRunning){clickCount++;document.getElementById('clickCount').textContent=clickCount;}else if(clickTime===0){drawClick();}}
</script>
</body>
</html>
